<svg width="100%" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="60%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="50%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>
    <radialGradient id="glow" cx="450" cy="110" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Card Background -->
  <rect width="900" height="220" rx="12" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Subtle Ambient Glow -->
  <rect width="900" height="220" rx="12" fill="url(#glow)" />

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="900" height="3.5" rx="1.5" fill="url(#accent-grad)" />

  <!-- Decorative Grid Dots -->
  <g opacity="0.15" fill="#8b949e">
    <circle cx="50" cy="40" r="1.5" />
    <circle cx="70" cy="40" r="1.5" />
    <circle cx="90" cy="40" r="1.5" />
    <circle cx="50" cy="60" r="1.5" />
    <circle cx="70" cy="60" r="1.5" />
    <circle cx="90" cy="60" r="1.5" />
    <circle cx="810" cy="160" r="1.5" />
    <circle cx="830" cy="160" r="1.5" />
    <circle cx="850" cy="160" r="1.5" />
    <circle cx="810" cy="180" r="1.5" />
    <circle cx="830" cy="180" r="1.5" />
    <circle cx="850" cy="180" r="1.5" />
  </g>

  <!-- Main Name Heading -->
  <text x="450" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#f0f6fc" letter-spacing="0.5">
    SAKTI MUJAHID IMANI
  </text>

  <!-- Subtitle -->
  <text x="450" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#58a6ff" letter-spacing="0.3">
    Computer Science Graduate &bull; Institut Teknologi Sumatera (ITERA)
  </text>

  <!-- Tag Pills -->
  <g transform="translate(450, 150)">
    <!-- Pill 1: Software Engineering -->
    <g transform="translate(-270, 0)">
      <rect x="0" y="0" width="165" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="82.5" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#c9d1d9">
        Software Engineering
      </text>
    </g>

    <!-- Pill 2: Quality Assurance (QA) -->
    <g transform="translate(-85, 0)">
      <rect x="0" y="0" width="170" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="85" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#c9d1d9">
        Quality Assurance &bull; QA
      </text>
    </g>

    <!-- Pill 3: Applied Machine Learning -->
    <g transform="translate(105, 0)">
      <rect x="0" y="0" width="165" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="82.5" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#c9d1d9">
        Applied Machine Learning
      </text>
    </g>
  </g>
</svg>
